<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حِرفة — رفيق البرمجة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#111823;--side:#0d131c;--ink:#e8eef7;--mute:#7d8ba3;--line:#1e2a3a;--acc:#10b981;--acc2:#3b82f6;--code:#0a0f17;--user:#0d2a3a;--err:#ef4444}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-family:inherit}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:700}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;font-weight:700}
.brand{color:var(--acc);font-weight:900;font-size:18px}
.select{width:auto;padding:7px 10px;font-size:13px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.hero{max-width:760px;margin:auto;text-align:center;padding:40px 20px}
.hero h2{font-size:32px;margin:0 0 10px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.hero p{color:var(--mute);margin:0 0 24px}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tpl button{padding:14px;background:var(--panel);text-align:start;font-size:13.5px;border-radius:12px}
.tpl button b{display:block;font-size:14px;margin-bottom:4px;color:var(--ink)}
.tpl button small{color:var(--mute);font-size:11.5px}
.m{max-width:820px;width:100%;margin:0 auto;padding:14px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);line-height:1.85;overflow-wrap:anywhere}
.m::before{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--acc)}
.m.a::before{content:'نَديم ✦'}
.m.u{background:var(--user)}
.m.u::before{content:'أنت';color:var(--mute)}
.m code{background:var(--side);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:13px;direction:ltr}
.cb{background:var(--code);border-radius:12px;margin:10px 0;overflow:hidden;direction:ltr;border:1px solid #1e293b}
.ch-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;color:#94a3b8;font-size:12px;border-bottom:1px solid #1e293b}
.ch-bar button{border:0;color:#cbd5e1;font-size:12px;padding:3px 9px;background:none}
.cb pre{margin:0;padding:14px;overflow-x:auto;font:13.5px/1.6 'JetBrains Mono',monospace;white-space:pre;text-align:left}
.cb pre code{background:none;padding:0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:b 1s infinite;display:inline-block;margin:0 2px}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
#compose-wrap{padding:12px 16px;border-top:1px solid var(--line)}
#compose{display:flex;gap:8px;max-width:860px;margin:0 auto;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
#compose textarea{border:0;background:none;flex:1;max-height:200px;padding:8px 10px;resize:none}
#compose textarea:focus{box-shadow:none}
#sendBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;min-width:44px;min-height:44px;font-size:16px;border-radius:12px}
#sendBtn.stop{background:var(--err)}
#toasts{position:fixed;bottom:20px;inset-inline:20px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:300;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:420px;pointer-events:auto}
.toast.err{border-color:var(--err);color:var(--err)}
@media(max-width:860px){.hero h2{font-size:24px}.tpl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toasts"></div>

<header>
  <span class="brand">⚒ حِرفة</span>
  <h1 id="ttl">رفيق البرمجة</h1>
  <select class="select" id="model">
    <option value="gemini-2.0-flash-lite">⚡ سريع</option>
    <option value="gemini-2.0-flash" selected>⚖️ متوازن</option>
    <option value="gemini-2.5-pro">🧠 عميق</option>
  </select>
  <button id="newBtn">＋ جديد</button>
</header>

<div id="msgs"></div>

<div id="compose-wrap">
  <div id="compose">
    <textarea id="in" rows="1" placeholder="اسأل نَديم…"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K={get:k=>{try{return JSON.parse(localStorage.getItem('hirfa_'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('hirfa_'+k,JSON.stringify(v))}catch(e){}}};

let msgs=K.get('msgs')||[],busy=false,ctrl=null;
const SYS='أنت "نَديم"، مساعد برمجة ذكي. أسلوبك مصري مبسّط ومباشر. الكود بالإنجليزي جوه بلوكات ``` مع تحديد اللغة. لو الطلب صفحة أو لعبة، اكتبها HTML واحد جاهز.';
const TPL={
'⚛️ React':'اكتب مكوّن React لقائمة مهام بـ hooks.',
'🌐 صفحة هبوط':'صفحة هبوط عصرية كملف HTML واحد بتصميم داكن.',
'🎮 لعبة Snake':'لعبة Snake كاملة في HTML واحد.',
'🐍 Python':'سكربت Python يرتب ملفات فولدر حسب الامتداد.',
'🚀 Express API':'REST API بـ Express فيه CRUD كامل.',
'🗄️ SQL':'استعلامات SQL لأعلى العملاء والمبيعات.',
'🐳 Docker':'Dockerfile + docker-compose لـ Node+Postgres.',
'🔍 Regex':'Regex للإيميل ورقم موبايل مصري.'};

function toast(m,t=''){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300)},2800)}

function md(s){
  if(!s)return '<span class="dots"><i></i><i></i><i></i></span>';
  const blocks=[];
  s=s.replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g,(m,l,c)=>{blocks.push({lang:(l||'text').toLowerCase(),code:c.replace(/\n$/,'')});return '\u0001'+(blocks.length-1)+'\u0001'});
  s=esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4} (.*)$/gm,'<b style="display:block;margin:6px 0 3px;font-size:15px">$1</b>').replace(/^[-*] /gm,'• ');
  return s.replace(/\n?\u0001(\d+)\u0001\n?/g,(m,i)=>{const b=blocks[+i];
    return '<div class="cb"><div class="ch-bar"><span>'+esc(b.lang)+'</span><button data-code="'+i+'">📋 نسخ</button></div><pre><code class="language-'+esc(b.lang)+'">'+esc(b.code)+'</code></pre></div>';
  });
}

function draw(){
  const M=$('#msgs');M.innerHTML='';
  if(!msgs.length){
    M.innerHTML='<div class="hero"><h2>إيه اللي هنبنيه النهارده؟</h2><p>اكتب سؤالك تحت أو اختار قالب</p><div class="tpl">'+Object.entries(TPL).map(([k,v])=>'<button data-t="'+esc(k)+'"><b>'+esc(k)+'</b><small>'+esc(v)+'</small></button>').join('')+'</div></div>';
    return;
  }
  msgs.forEach((m,i)=>{
    const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');d.innerHTML=md(m.content);
    d.dataset.code=m.content;M.appendChild(d);
  });
  M.scrollTop=M.scrollHeight;
  if(window.Prism)Prism.highlightAllUnder(M);
}

$('#msgs').addEventListener('click',e=>{
  const t=e.target.closest('button[data-t]');if(t)return send(TPL[t.dataset.t]);
  const c=e.target.closest('button[data-code]');
  if(c){const blocks=[...e.target.closest('.m').querySelectorAll('.cb code')];navigator.clipboard.writeText(blocks[+c.dataset.code].textContent);c.textContent='✓ تم';setTimeout(()=>c.textContent='📋 نسخ',1200)}
});

async function callNadeem(signal,onText){
  const model=$('#model').value;
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model,system:SYS}),signal});
  if(!res.ok){const t=await res.text();throw{code:res.status===429?'rate_limited':'error',text:t}}
  const reader=res.body.getReader(),dec=new TextDecoder();let full='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    full+=dec.decode(value,{stream:true});
    onText(full);
  }
  return full;
}

async function send(text){
  text=(text||'').trim();if(!text||busy)return;
  msgs.push({role:'user',content:text});
  const a={role:'assistant',content:''};msgs.push(a);
  $('#in').value='';$('#in').style.height='auto';draw();
  const el=$('#msgs').lastElementChild;el.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  ctrl=new AbortController();busy=true;$('#sendBtn').textContent='⬛';$('#sendBtn').classList.add('stop');
  try{
    const r=await callNadeem(ctrl.signal,t=>{a.content=t;el.innerHTML=md(t);$('#msgs').scrollTop=$('#msgs').scrollHeight;if(window.Prism)Prism.highlightAllUnder(el)});
    a.content=r||a.content;
  }catch(e){
    if(e.name==='AbortError')a.content=(a.content||'')+'\n\n_(اتوقف)_';
    else if(e.code==='rate_limited')a.content='الطلبات كتير، جرّب بعد شوية';
    else a.content='حصلت مشكلة، جرّب تاني';
  }
  busy=false;ctrl=null;$('#sendBtn').textContent='➤';$('#sendBtn').classList.remove('stop');
  K.set('msgs',msgs);draw();
}

$('#sendBtn').onclick=()=>{if(busy)ctrl.abort();else send($('#in').value)};
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#in').value)}});
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,200)+'px'});
$('#newBtn').onclick=()=>{if(busy)return;msgs=[];K.set('msgs',[]);draw()};

draw();
</script>
</body>
  </html>
